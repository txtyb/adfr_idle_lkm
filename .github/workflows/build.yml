name: Build adfr_idle LKM

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI target'
        required: true
        default: android16-6.12
        type: choice
        options: [android16-6.12]
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ github.event.inputs.kmi || 'android16-6.12' }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        run: |
          set -e
          KMI="${{ github.event.inputs.kmi || 'android16-6.12' }}"
          cd kernel
          make VER="$KMI"
          echo "--- output ---"
          ls -la "out/$KMI/"

      - name: Strip and check
        run: |
          set -e
          KMI="${{ github.event.inputs.kmi || 'android16-6.12' }}"
          KO="kernel/out/$KMI/adfr_idle.ko"
          (llvm-strip -d "$KO" 2>/dev/null || strip -d "$KO" 2>/dev/null || true)
          file "$KO" || true
          du -h "$KO"

      - name: Package KernelSU module
        run: |
          set -e
          KMI="${{ github.event.inputs.kmi || 'android16-6.12' }}"
          KO="kernel/out/$KMI/adfr_idle.ko"
          rm -rf pkg && mkdir -p pkg/lib pkg/bin
          cp ksu-module/module.prop pkg/
          cp ksu-module/service.sh ksu-module/post-fs-data.sh ksu-module/uninstall.sh pkg/
          cp ksu-module/bin/ltpo_idle.sh ksu-module/bin/ctl.sh pkg/bin/
          cp -r ksu-module/webroot pkg/
          cp "$KO" pkg/lib/adfr_idle.ko
          chmod 755 pkg/service.sh pkg/post-fs-data.sh pkg/uninstall.sh pkg/bin/ltpo_idle.sh pkg/bin/ctl.sh
          sed -i "s/^version=.*/version=v1.0-${KMI}/" pkg/module.prop
          cd pkg
          (zip -qr "../adfr_idle-${KMI}-ksu.zip" . || python3 -c "import shutil;shutil.make_archive('../adfr_idle-${KMI}-ksu','zip','.')")
          cd ..
          ls -la adfr_idle-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adfr_idle-ksu
          path: adfr_idle-*-ksu.zip
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: adfr_idle-*-ksu.zip
          generate_release_notes: true
